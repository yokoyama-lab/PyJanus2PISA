name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest test_janus2pisa.py test_inverse.py test_pisa_interp.py -q

  rocq:
    name: Rocq proofs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # only for the failure-report comment below
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: rocq/rocq-prover:9.1.1-native-flambda
          # The image ships rocq-prover 9.1.1; there is no opam file to pin, so
          # the action's default opam install/uninstall phases are no-ops.
          install: |
            startGroup "Toolchain shipped by the image (no opam install needed)"
              rocq --version
            endGroup
          uninstall: |
            startGroup "Nothing to uninstall"
            endGroup
          # The checkout is owned by the runner user (1001) while the container
          # runs as coq (1000); `rocq makefile -o Makefile` needs to write here.
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .
            endGroup
          # tee'd into ci-log.txt so a failure can be reported on the PR: the
          # raw Actions log is not reachable from every network.
          script: |
            set -o pipefail
            {
            startGroup "Build proofs"
              cd rocq
              rocq makefile -f _CoqProject -o Makefile
              make -j2
            endGroup
            } 2>&1 | tee ci-log.txt
      - name: Revert permissions
        if: ${{ always() }}
        run: sudo chown -R 1001:116 .
      - name: Report a failure on the pull request
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Rocq proofs failed for ${{ github.sha }}: [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            if [ -s ci-log.txt ]; then
              echo 'Last 60 lines of the build script output:'
              echo '```'
              tail -n 60 ci-log.txt
              echo '```'
            else
              echo 'The build script did not start: the failure is in the action'\''s install/setup phase (see the run).'
            fi
          } > failure-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file failure-comment.md
