name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest test_janus2pisa.py test_inverse.py test_pisa_interp.py -q

  rocq:
    name: Rocq proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: rocq/rocq-prover:9.1.1-native-flambda
          install: |
            startGroup "No opam dependencies"
            endGroup
          # The checkout is owned by the runner user (1001) while the container
          # runs as coq (1000); `rocq makefile -o Makefile` needs to write here.
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .
            endGroup
          script: |
            startGroup "Build proofs"
              cd rocq
              rocq makefile -f _CoqProject -o Makefile
              make -j2
            endGroup
      - name: Revert permissions
        if: ${{ always() }}
        run: sudo chown -R 1001:116 .
